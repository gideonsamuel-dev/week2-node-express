<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Week 2 API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      color: #222;
    }
    h1 { color: #c0392b; }
    code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 4px;
    }
    ul { line-height: 1.8; }
  </style>
</head>
<body>
  <h1>My Week 2 API!</h1>
  <p>This static page is served from Express at <code>GET /</code>.</p>
  <p>Available endpoints:</p>
  <ul>
    <li><code>GET /api</code> → "My Week 2 API!"</li>
    <li><code>POST /user</code> → Accepts <code>{ name, email }</code>, responds "Hello, [name]!"</li>
    <li><code>GET /user/:id</code> → "User [id] profile"</li>
  </ul>
</body>
</html>
